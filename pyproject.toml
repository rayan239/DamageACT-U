[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "damageactu"
version = "1.0.0rc1"
description = "POST-anchored temporal-utility routing for reliable building-damage assessment"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "Pillow>=10",
  "PyYAML>=6",
  "joblib>=1.3",
  "shapely>=2.0",
  "tqdm>=4.66"
]


[project.optional-dependencies]
torch = ["torch>=2.10", "torchvision>=0.25"]
dev = ["pytest>=8"]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

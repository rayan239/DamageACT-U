<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="800" y="42" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#13213a">DamageACT-U: exact frozen model architecture</text>
<text x="800" y="76" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#13213a">Two independently trained experts with matched trainable architecture/parameter count; the Siamese expert shares one encoder across PRE and POST.</text>
<rect x="20" y="110" width="1230" height="455" rx="18" fill="#f8fbff" stroke="#5B9BD5" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="60" cy="138" r="23" fill="#1976d2"/><text x="60" y="145" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="95" y="146" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#13213a">Inputs and two expert models</text>
<text x="95" y="170" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#13213a">Both experts use ImageNet-pretrained ResNet-18 encoders and identical 1536→512→4 classifier-head architecture.</text>
<rect x="20" y="585" width="1230" height="250" rx="18" fill="#f8fff7" stroke="#70AD47" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="60" cy="615" r="23" fill="#15803d"/><text x="60" y="622" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="95" y="622" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#174d2c">Diagnostics and temporal-utility router</text>
<text x="95" y="646" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#174d2c">Router uses only expert-output diagnostics: no raw images and no latent ResNet features.</text>
<rect x="1270" y="110" width="310" height="725" rx="18" fill="#fffaf3" stroke="#ED7D31" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="1310" cy="138" r="23" fill="#d95f02"/><text x="1310" y="145" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="1345" y="146" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#b84b00">Final routed prediction</text>
<rect x="45" y="205" width="145" height="115" rx="12" fill="#f5f7fa" stroke="#73808c" stroke-width="2"/><text x="117.5" y="235" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#13213a">PRE crop</text><text x="117.5" y="263" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">192×192×3</text><text x="117.5" y="285" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">PRE-referenced window</text><text x="117.5" y="307" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">ImageNet normalized</text>
<rect x="45" y="390" width="145" height="115" rx="12" fill="#f5f7fa" stroke="#73808c" stroke-width="2"/><text x="117.5" y="420" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#13213a">POST crop</text><text x="117.5" y="448" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">192×192×3</text><text x="117.5" y="470" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">same pixel window</text><text x="117.5" y="492" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">ImageNet normalized</text>
<rect x="245" y="205" width="210" height="115" rx="12" fill="#eaf3fb" stroke="#2E75B6" stroke-width="2"/><text x="350" y="235" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#13213a">Siamese expert</text><text x="350" y="263" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">Shared ResNet-18 E_T(·)</text><text x="350" y="285" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">weights tied PRE/POST</text><text x="350" y="307" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">512-D per image</text>
<rect x="515" y="205" width="230" height="115" rx="12" fill="#eaf3fb" stroke="#2E75B6" stroke-width="2"/><text x="630" y="235" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#13213a">Temporal representation</text><text x="630" y="263" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">[z_pre, z_post, |z_post−z_pre|]</text><text x="630" y="285" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">1536-D</text>
<rect x="805" y="205" width="205" height="115" rx="12" fill="#eaf3fb" stroke="#2E75B6" stroke-width="2"/><text x="907.5" y="235" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#13213a">Classifier head</text><text x="907.5" y="263" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">Linear 1536→512</text><text x="907.5" y="285" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">ReLU • Dropout 0.30</text><text x="907.5" y="307" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">Linear 512→4</text>
<rect x="1070" y="205" width="145" height="115" rx="12" fill="#eaf3fb" stroke="#2E75B6" stroke-width="2"/><text x="1142.5" y="235" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#13213a">Pair logits</text><text x="1142.5" y="263" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">L_pair in R^4</text>
<rect x="245" y="390" width="210" height="115" rx="12" fill="#f3ecfa" stroke="#7030A0" stroke-width="2"/><text x="350" y="420" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#13213a">POST-only expert</text><text x="350" y="448" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">Separate ResNet-18 E_P(·)</text><text x="350" y="470" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">ImageNet pretrained</text><text x="350" y="492" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">512-D</text>
<rect x="515" y="390" width="230" height="115" rx="12" fill="#f3ecfa" stroke="#7030A0" stroke-width="2"/><text x="630" y="420" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#13213a">Parameter/head match</text><text x="630" y="448" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">[z_post, z_post, z_post]</text><text x="630" y="470" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">1536-D</text><text x="630" y="492" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">no new information</text>
<rect x="805" y="390" width="205" height="115" rx="12" fill="#f3ecfa" stroke="#7030A0" stroke-width="2"/><text x="907.5" y="420" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#13213a">Classifier head</text><text x="907.5" y="448" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">Linear 1536→512</text><text x="907.5" y="470" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">ReLU • Dropout 0.30</text><text x="907.5" y="492" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">Linear 512→4</text>
<rect x="1070" y="390" width="145" height="115" rx="12" fill="#f3ecfa" stroke="#7030A0" stroke-width="2"/><text x="1142.5" y="420" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#13213a">POST logits</text><text x="1142.5" y="448" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">L_post in R^4</text>
<polyline points="190,248 245,248" fill="none" stroke="#2E75B6" stroke-width="3" marker-end="url(#arrow)"/><polyline points="190,448 220,448 220,278 245,278" fill="none" stroke="#2E75B6" stroke-width="3" marker-end="url(#arrow)"/><polyline points="190,448 245,448" fill="none" stroke="#7030A0" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="455,262 515,262" fill="none" stroke="#2E75B6" stroke-width="3" marker-end="url(#arrow)"/><text x="485" y="250" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#13213a">z_pre,z_post</text><polyline points="745,262 805,262" fill="none" stroke="#2E75B6" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1010,262 1070,262" fill="none" stroke="#2E75B6" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="455,448 515,448" fill="none" stroke="#7030A0" stroke-width="3" marker-end="url(#arrow)"/><text x="485" y="438" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#13213a">z_post</text><polyline points="745,448 805,448" fill="none" stroke="#7030A0" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1010,448 1070,448" fill="none" stroke="#7030A0" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="335" y="680" width="440" height="120" rx="12" fill="#eef7ea" stroke="#548235" stroke-width="2"/><text x="555" y="710" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#13213a">Softmax + 26 diagnostic features</text><text x="555" y="738" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">16 classwise: p_post,k, p_pair,k, Δp_k, |Δp_k|</text><text x="555" y="760" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">+ 10 confidence / entropy / severity / disagreement features</text>
<rect x="820" y="680" width="180" height="120" rx="12" fill="#eef7ea" stroke="#548235" stroke-width="2"/><text x="910" y="710" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#13213a">Frozen z-score</text><text x="910" y="738" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">x'_j=(x_j−μ_j)/σ_j</text><text x="910" y="760" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">μ_j,σ_j frozen</text><text x="910" y="782" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">26-D → 26-D</text>
<rect x="1040" y="680" width="180" height="120" rx="12" fill="#eef7ea" stroke="#548235" stroke-width="2"/><text x="1130" y="710" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#13213a">Temporal-utility router</text><text x="1130" y="738" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">26→32→16→1</text><text x="1130" y="760" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">ReLU • Dropout 0.10</text><text x="1130" y="782" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">Sigmoid → u in [0,1]</text><text x="1130" y="804" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">1,409 params</text>
<polyline points="1142,320 1142,610 650,610 650,680" fill="none" stroke="#2E75B6" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1142,505 1142,635 700,635 700,680" fill="none" stroke="#7030A0" stroke-width="3" marker-end="url(#arrow)"/><polyline points="775,740 820,740" fill="none" stroke="#548235" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1000,740 1040,740" fill="none" stroke="#548235" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1310" y="205" width="230" height="130" rx="12" fill="#fde9e7" stroke="#c62828" stroke-width="2"/><text x="1425" y="235" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#13213a">Final class (4 classes)</text><text x="1425" y="263" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">0 no-damage • 1 minor</text><text x="1425" y="285" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">2 major • 3 destroyed</text>
<rect x="1310" y="420" width="230" height="175" rx="12" fill="#fff2e8" stroke="#c55a11" stroke-width="2"/><text x="1425" y="450" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#13213a">POST-anchored routing</text><text x="1425" y="478" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">L_route=L_post+u(L_pair−L_post)</text><text x="1425" y="500" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">=(1−u)L_post+uL_pair</text><text x="1425" y="522" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">u=0 → exact POST</text><text x="1425" y="544" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">u=1 → exact Siamese</text><text x="1425" y="566" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1c2434">logit-space interpolation</text>
<polyline points="1215,262 1275,262 1275,475 1310,475" fill="none" stroke="#2E75B6" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1215,448 1288,448 1288,520 1310,520" fill="none" stroke="#7030A0" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1220,740 1250,740 1250,565 1310,565" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/><text x="1240" y="720" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#15803d">u</text><polyline points="1425,420 1425,335" fill="none" stroke="#c55a11" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="30" y1="858" x2="1570" y2="858" stroke="#6b7280" stroke-width="1.5"/><text x="40" y="884" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#13213a">Trainable parameters:</text><text x="195" y="884" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="start" fill="#13213a">11,965,508 per expert • 1,409 neural router • 23,932,425 unique parameters in the full two-expert + router system.</text>

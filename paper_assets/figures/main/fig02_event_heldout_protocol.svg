<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="670" viewBox="0 0 1400 670">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
  </marker>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#111827}
    .box{fill:#ffffff;stroke:#334155;stroke-width:2}
    .dev{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
    .test{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
    .select{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}
    .a{stroke:#1f2937;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text class="t" x="700" y="38" font-size="26" font-weight="700" text-anchor="middle">Final event-held-out experimental protocol</text>

<rect class="box" x="590" y="68" width="220" height="82" rx="12"/>
<text class="t" x="700" y="102" font-size="19" font-weight="700" text-anchor="middle">19 disasters</text>
<text class="t" x="700" y="130" font-size="15" text-anchor="middle">11,034 patches</text>

<rect class="dev" x="170" y="205" width="330" height="88" rx="12"/>
<text class="t" x="335" y="240" font-size="19" font-weight="700" text-anchor="middle">13 development events</text>
<text class="t" x="335" y="268" font-size="15" text-anchor="middle">9,114 patches</text>

<rect class="test" x="900" y="205" width="330" height="88" rx="12"/>
<text class="t" x="1065" y="240" font-size="19" font-weight="700" text-anchor="middle">6 completely held-out TEST events</text>
<text class="t" x="1065" y="268" font-size="15" text-anchor="middle">1,920 patches</text>

<path class="a" d="M655 150 L350 205"/>
<path class="a" d="M745 150 L1050 205"/>
<text class="t" x="700" y="180" font-size="13" text-anchor="middle">predefined event assignment</text>

<rect class="dev" x="90" y="350" width="250" height="90" rx="12"/>
<text class="t" x="215" y="383" font-size="18" font-weight="700" text-anchor="middle">Train</text>
<text class="t" x="215" y="410" font-size="14" text-anchor="middle">8,202 patches · 265,273 buildings</text>

<rect class="dev" x="390" y="350" width="250" height="90" rx="12"/>
<text class="t" x="515" y="383" font-size="18" font-weight="700" text-anchor="middle">Validation</text>
<text class="t" x="515" y="410" font-size="14" text-anchor="middle">912 patches · 30,735 buildings</text>
<path class="a" d="M300 293 L220 350"/>
<path class="a" d="M370 293 L500 350"/>

<rect class="select" x="90" y="500" width="250" height="86" rx="12"/>
<text class="t" x="215" y="533" font-size="17" font-weight="700" text-anchor="middle">Router-select</text>
<text class="t" x="215" y="558" font-size="14" text-anchor="middle">scene-disjoint · selection only</text>

<rect class="select" x="390" y="500" width="250" height="86" rx="12"/>
<text class="t" x="515" y="533" font-size="17" font-weight="700" text-anchor="middle">Router-diagnostic</text>
<text class="t" x="515" y="558" font-size="14" text-anchor="middle">scene-disjoint · one-time diagnostic</text>
<path class="a" d="M485 440 L235 500"/>
<path class="a" d="M540 440 L500 500"/>

<line x1="795" y1="180" x2="795" y2="605" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 6"/>
<text class="t" x="815" y="325" font-size="13" transform="rotate(90 815 325)">TEST boundary</text>

<rect class="test" x="930" y="350" width="270" height="90" rx="12"/>
<text class="t" x="1065" y="383" font-size="18" font-weight="700" text-anchor="middle">Final sealed TEST</text>
<text class="t" x="1065" y="408" font-size="14" text-anchor="middle">115,349 buildings</text>
<text class="t" x="1065" y="428" font-size="12" text-anchor="middle">opened only after choices are frozen</text>
<path class="a" d="M1065 293 L1065 350"/>

<rect class="test" x="930" y="500" width="270" height="86" rx="12"/>
<text class="t" x="1065" y="529" font-size="17" font-weight="700" text-anchor="middle">One-shot evaluation</text>
<text class="t" x="1065" y="550" font-size="12.5" text-anchor="middle">2,000 clean + 2,000 wrong-PRE scene bootstraps</text>
<text class="t" x="1065" y="568" font-size="12.5" text-anchor="middle">1,000 utility bootstraps · NO post-TEST tuning</text>
<path class="a" d="M1065 440 L1065 500"/>

<text class="t" x="700" y="640" font-size="13" text-anchor="middle">Integrity locks: 0 development↔TEST event leakage · 0 train↔validation building overlap · 0 train↔validation scene overlap</text>
</svg>

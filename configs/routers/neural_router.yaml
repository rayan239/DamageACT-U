architecture:
  input_features: 26
  hidden_1: 32
  hidden_2: 16
  output: 1
  activation: relu
  dropout: 0.10
training:
  seed: 42
  batch_size: 256
  max_epochs: 100
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
loss:
  utility: 0.5
  wrong_gate: 0.5
  wrong_kl: 0.5
  sparsity: 0.01
selection:
  wrongpre_tolerance: 0.01
  primary_metric: macro_f1
  exact_tie: earlier_epoch
final_selected_epoch: 1

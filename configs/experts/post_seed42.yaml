  amp: true
  scheduler: null
  early_stopping: false
  focal_loss: false
  oversampling: false
class_weights:
  0: 0.3491195254016762
  1: 1.2918169707179104
  2: 1.1515690289737834
  3: 1.20749447490663
checkpoint:
  metric: macro_f1
  rule: highest_event_val
  exact_tie: earlier_epoch

model_type: post_only
representation: "[z_post, z_post, z_post]"
